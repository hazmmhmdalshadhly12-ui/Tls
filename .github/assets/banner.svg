<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HAZEM Tunnel banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f1d33"/>
      <stop offset="1" stop-color="#122b47"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="tunnelFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="297" rx="21" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="3"/>

  <!-- tunnel motif (right side) -->
  <g transform="translate(985,150)">
    <ellipse cx="0" cy="0" rx="150" ry="96" fill="none" stroke="#22d3ee" stroke-opacity="0.10" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="118" ry="76" fill="none" stroke="#22d3ee" stroke-opacity="0.18" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="86" ry="56" fill="none" stroke="#22d3ee" stroke-opacity="0.28" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="54" ry="36" fill="none" stroke="#22d3ee" stroke-opacity="0.42" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="26" ry="18" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="0" cy="0" r="6" fill="#22d3ee"/>
    <line x1="26" y1="0" x2="185" y2="0" stroke="url(#tunnelFade)" stroke-width="3" stroke-dasharray="7 7"/>
  </g>

  <!-- lock glyph -->
  <g transform="translate(72,64)">
    <rect x="0" y="34" width="52" height="40" rx="9" fill="none" stroke="#22d3ee" stroke-width="4"/>
    <path d="M 10 34 v-10 a16 16 0 0 1 32 0 v10" fill="none" stroke="#22d3ee" stroke-width="4"/>
    <circle cx="26" cy="52" r="5" fill="#22d3ee"/>
    <line x1="26" y1="55" x2="26" y2="65" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <text x="72" y="150" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="700" fill="#f1f5f9" letter-spacing="1">HAZEM <tspan fill="#22d3ee">Tunnel</tspan></text>
  <text x="73" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">Encrypted tunneling desktop client for Windows</text>

  <!-- transport chips -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600">
    <rect x="72" y="222" width="118" height="40" rx="20" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.55"/>
    <text x="131" y="248" text-anchor="middle" fill="#67e8f9">TLS + SNI</text>

    <rect x="202" y="222" width="86" height="40" rx="20" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.55"/>
    <text x="245" y="248" text-anchor="middle" fill="#67e8f9">SSH</text>

    <rect x="300" y="222" width="130" height="40" rx="20" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.55"/>
    <text x="365" y="248" text-anchor="middle" fill="#67e8f9">WebSocket</text>

    <rect x="442" y="222" width="210" height="40" rx="20" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="547" y="248" text-anchor="middle" fill="#fcd34d">SOCKS5 127.0.0.1</text>
  </g>

  <!-- version tag -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="72" y="26" width="112" height="30" rx="15" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="128" y="46" text-anchor="middle" fill="#6ee7b7">v1.2.0</text>
  </g>
</svg>
