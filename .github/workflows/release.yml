name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish win-x64 & attach zip
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish + package (version from tag)
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $v = $env:VERSION.TrimStart("v")
          Write-Host "Publishing version $v"
          pwsh -File scripts/publish.ps1 -Version $v

      - name: Compute SHA-256
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $v = $env:VERSION.TrimStart("v")
          $zip = "dist/HAZEM-Tunnel-$v-win-x64.zip"
          if (-not (Test-Path $zip)) { throw "Missing artifact: $zip" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Out-File -Encoding ascii "$zip.sha256"
          Write-Host "SHA-256: $hash"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
